<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Apna Okara posts</title>
<style>
@font-face { font-family: 'Nastaliq'; src: url('../../../../node_modules/@expo-google-fonts/noto-nastaliq-urdu/NotoNastaliqUrdu_400Regular.ttf'); font-weight: 400; }
@font-face { font-family: 'Nastaliq'; src: url('../../../../node_modules/@expo-google-fonts/noto-nastaliq-urdu/NotoNastaliqUrdu_700Bold.ttf'); font-weight: 700; }
:root { --g: #15803D; --gd: #0F5C2C; --gl: #DCFCE7; --o: #F97316; --od: #C2410C; --ol: #FFEDD5; --ink: #1F2937; --lh: 1.75; }

html, body { width: 1080px; height: 1080px; overflow: hidden; background: #fff; }
body.ur { font-family: 'Nastaliq', serif; direction: rtl; }
body.en { font-family: 'Segoe UI', Arial, sans-serif; direction: ltr; --lh: 1.12; }
body.en h1 { font-weight: 800; letter-spacing: -1.5px; }
body.en p, body.en small, body.en li, body.en b { line-height: 1.3; }
body { color: var(--ink); }
.post { width: 1080px; height: 1080px; position: relative; overflow: hidden; }
.lat { font-family: 'Segoe UI', Arial, sans-serif; direction: ltr; unicode-bidi: isolate; }
.emoji { font-family: 'Segoe UI Emoji', sans-serif; }
.flow { position: absolute; top: 60px; right: 60px; left: 60px; bottom: 150px; display: flex; flex-direction: column; gap: 22px; }
.bar { position: absolute; left: 0; right: 0; bottom: 0; height: 120px; display: flex; align-items: center; justify-content: space-between; padding: 0 60px; direction: ltr; }
.logo { display: flex; align-items: center; gap: 14px; white-space: nowrap; }
.logo b { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 800; font-size: 40px; letter-spacing: -0.5px; line-height: 1; }
.url { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; font-size: 32px; padding: 12px 28px; border-radius: 999px; white-space: nowrap; }
.photo { background-size: cover; background-position: center; }

/* ---------- 1 launch: photo mosaic ---------- */

#p1 .mosaic div:nth-child(5) { grid-column: span 2; }
#p1 .shade { position: absolute; inset: 0 0 120px 0; background: linear-gradient(180deg, rgba(15,92,44,.15) 0%, rgba(15,92,44,.55) 38%, rgba(10,60,30,.96) 72%, #0A3C1E 100%); }
#p1 .badge { position: absolute; top: 50px; inset-inline-start: 60px; background: var(--o); color: #fff; font-weight: 700; font-size: 36px; padding: 4px 30px 18px; border-radius: 999px; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
body.en #p1 .badge { padding: 12px 30px; font-size: 32px; letter-spacing: 1px; text-transform: uppercase; }
#p1 .copy { position: absolute; inset-inline: 60px; bottom: 165px; }
#p1 h1 { font-size: 100px; line-height: var(--lh); font-weight: 700; text-shadow: 0 4px 24px rgba(0,0,0,.35); }
body.en #p1 h1 { font-size: 108px; }
#p1 h1 span { color: #FFB877; }
#p1 .cities { display: flex; gap: 14px; margin-top: 18px; flex-wrap: wrap; }
#p1 .cities span { background: rgba(255,255,255,.16); border: 2px solid rgba(255,255,255,.35); border-radius: 999px; padding: 0 26px 12px; font-size: 34px; }
body.en #p1 .cities span { padding: 8px 26px; font-weight: 600; }
#p1 .bar { background: #fff; color: var(--g); }
#p1 .bar .url { background: var(--o); color: #fff; }

/* ---------- 2 how to post ---------- */
#p2 { background: var(--ol); }
#p2 .top { position: absolute; top: 0; left: 0; right: 0; height: 345px; background: var(--od); color: #fff; padding: 50px 60px 0; clip-path: polygon(0 0, 100% 0, 100% 88%, 0 100%); }
#p2 .top small { font-size: 38px; color: var(--ol); display: block; }
#p2 .top h1 { font-size: 74px; line-height: var(--lh); font-weight: 700; }
body.en #p2 .top h1 { font-size: 84px; margin-top: 14px; }
#p2 .top h1 span { background: #fff; color: var(--od); padding: 0 22px 14px; border-radius: 18px; white-space: nowrap; }
body.en #p2 .top h1 span { padding: 4px 22px 8px; }
#p2 .flow { top: 365px; bottom: 140px; gap: 18px; }
#p2 .steps { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; flex: 1; }
#p2 .step { background: #fff; border-radius: 30px; padding: 20px 26px 22px; box-shadow: 0 8px 24px rgba(194,65,12,.12); position: relative; }
#p2 .num { width: 60px; height: 60px; border-radius: 50%; background: var(--g); color: #fff; font-family: 'Segoe UI', Arial, sans-serif; font-weight: 800; font-size: 32px; display: flex; align-items: center; justify-content: center; }
#p2 .step .emoji { position: absolute; inset-inline-end: 26px; top: 20px; font-size: 52px; }
#p2 .step p { font-size: 31px; line-height: 1.75; margin-top: 10px; font-weight: 700; }
body.en #p2 .step p { font-size: 36px; margin-top: 18px; line-height: 1.25; }
#p2 .step p .lat { font-size: 28px; color: var(--g); }
#p2 .note { font-size: 31px; text-align: center; color: var(--od); }
body.en #p2 .note { font-weight: 600; }
#p2 .bar { background: var(--g); color: #fff; height: 110px; }
#p2 .bar .url { background: #fff; color: var(--g); }

/* ---------- 3 services: photo tiles ---------- */
#p3 { background: #0B3B1F; color: #fff; }
#p3 .glow { position: absolute; width: 900px; height: 900px; border-radius: 50%; background: radial-gradient(circle, rgba(249,115,22,.35), transparent 65%); top: -380px; inset-inline-end: -300px; }
#p3 h1 { font-size: 80px; line-height: var(--lh); font-weight: 700; margin-bottom: 18px; }
body.en #p3 h1 { font-size: 88px; margin-bottom: 8px; }
#p3 h1 span { color: var(--o); }
#p3 .q p { font-size: 36px; color: #BBF7D0; line-height: 1.8; }
body.en #p3 .q p { line-height: 1.3; }
#p3 .grid { margin-top: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
#p3 .tile { background: #fff; color: var(--ink); border-radius: 26px; overflow: hidden; }
#p3 .tile .photo { height: 150px; }
#p3 .tile b { font-size: 32px; line-height: 1.85; display: block; text-align: center; padding: 0 8px 12px; }

#p3 .stars { text-align: center; font-size: 32px; color: #FDE68A; }
#p3 .bar { color: #fff; border-top: 2px solid rgba(255,255,255,.15); }
#p3 .bar .url { background: var(--o); color: #fff; }

/* ---------- 4 safety ---------- */
#p4 { background: linear-gradient(160deg, #EFF6FF 0%, #F0FDF4 100%); }
#p4 .flow { gap: 18px; }
#p4 .headrow { display: flex; align-items: center; gap: 30px; }
#p4 .shield { flex: none; width: 150px; height: 172px; }
#p4 .head { flex: 1; }
#p4 .head small { font-size: 34px; color: var(--g); font-weight: 700; }
#p4 .head h1 { font-size: 66px; line-height: 1.7; font-weight: 700; }
body.en #p4 .head h1 { font-size: 74px; line-height: 1.05; margin-top: 8px; }
#p4 .card { background: #fff; border-radius: 36px; padding: 6px 40px; box-shadow: 0 16px 40px rgba(21,128,61,.14); flex: 1; display: flex; flex-direction: column; justify-content: space-around; }
#p4 .row { display: flex; align-items: center; gap: 26px; padding: 0 0 12px; border-bottom: 2px dashed #E5E7EB; font-size: 35px; }

#p4 .row:last-child { border: 0; }

body.en #p4 .tick { margin-top: 0; }

/* ---------- 5 rishta ---------- */

body.en #p5 .k { font-size: 30px; letter-spacing: 6px; text-transform: uppercase; font-weight: 600; }
#p5 h1 { font-size: 66px; line-height: var(--lh); font-weight: 700; }
body.en #p5 h1 { font-size: 72px; line-height: 1.1; font-family: Georgia, 'Times New Roman', serif; font-weight: 700; letter-spacing: -0.5px; }

#p6 { background: #075E54; color: #fff; }

body.ur #p6 .flow { right: 60px; }
body.en #p6 .flow { left: 60px; }
#p6 .txt small { font-size: 36px; color: #A7F3D0; }

#p6 .txt h1 { font-size: 58px; line-height: var(--lh); font-weight: 700; }

#p6 .screen { width: 100%; height: 100%; border-radius: 42px; background: #ECE5DD; overflow: hidden; }
#p6 .wa-head { background: #075E54; height: 96px; display: flex; align-items: center; gap: 12px; padding: 22px 20px 0; direction: ltr; }
#p6 .wa-head .av { width: 48px; height: 48px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; }
#p6 .wa-head b { font-family: 'Segoe UI', Arial; font-size: 22px; display: block; }
#p6 .wa-head i { font-family: 'Segoe UI', Arial; font-size: 15px; color: #A7F3D0; font-style: normal; }
#p6 .msg { margin: 16px 16px 0; background: #fff; color: var(--ink); border-radius: 18px; padding: 10px; box-shadow: 0 2px 4px rgba(0,0,0,.08); }
#p6 .msg .photo { height: 150px; border-radius: 12px; }
#p6 .msg p { font-size: 21px; line-height: 1.9; padding: 0 6px; }
body.en #p6 .msg p { font-size: 20px; line-height: 1.3; padding: 8px 6px 2px; font-weight: 600; }
#p6 .msg .pr { font-family: 'Segoe UI', Arial; font-weight: 800; color: var(--g); font-size: 21px; direction: ltr; padding: 0 6px; }

#p6 .cta { margin-top: auto; background: #25D366; color: #053B32; border-radius: 26px; padding: 8px 30px 22px; font-size: 40px; font-weight: 700; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.25); }

#p6 .bar { background: #fff; color: #075E54; height: 110px; }

#p1 .mosaic { inset: 0 0 auto 0; height: 600px; grid-template-columns: 1.25fr 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 6px; }

#p1 .mosaic div:nth-child(5) { grid-column: auto; }
#p1 .shade { inset: 0 0 120px 0; background: linear-gradient(180deg, rgba(0,0,0,.18) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 40%, rgba(10,60,30,.75) 52%, #0A3C1E 60%, #0A3C1E 100%); }
#p1 .copy { bottom: 150px; }
#p1 h1 { font-size: 92px; }
body.en #p1 h1 { font-size: 104px; }

body.en #p2 .top h1 { font-size: 78px; line-height: 1.32; margin-top: 6px; }
body.en #p5 .pts { margin-top: 70px; }

<div id="root"></div>
<script>

const n = q.get('n') || '1';
const L = q.get('lang') === 'en' ? 'en' : 'ur';
document.documentElement.lang = L;
document.body.className = L;
const ph = (x) => `<div class="photo" style="background-image:url('img/${x}.jpg')"></div>`;

    <div class="mosaic">${['house', 'bike', 'phone', 'cow', 'car'].map(ph).join('')}</div>
